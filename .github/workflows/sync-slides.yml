name: Sync Google Slides Data & Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python-pptx
        run: pip install python-pptx

      - name: Sync latest lesson plans from Google Slides
        run: |
          python - << 'EOF'
          import urllib.request, io, json, os
          from pptx import Presentation

          def extract_cell_text(cell):
              lines = []
              for p in cell.text_frame.paragraphs:
                  txt = p.text.strip()
                  if not txt:
                      continue
                  # Check XML for automatic bullet char (a:buChar) or level indentation
                  pPr = p._p.find('{http://schemas.openxmlformats.org/drawingml/2006/main}pPr')
                  bu_char = None
                  lvl = p.level or 0
                  if pPr is not None:
                      bu = pPr.find('{http://schemas.openxmlformats.org/drawingml/2006/main}buChar')
                      if bu is not None:
                          bu_char = bu.get('char')
                  if bu_char and not txt.startswith(bu_char) and not txt.startswith('•') and not txt.startswith('-'):
                      prefix = ('  ' * lvl) + ('• ' if bu_char in ('•', '●', '▪') else f'{bu_char} ')
                      txt = prefix + txt
                  elif lvl > 0 and not txt.startswith(' '):
                      txt = ('  ' * lvl) + ('- ' if not txt.startswith('-') else '') + txt
                  lines.append(txt)
              return "\n".join(lines).strip()

          existing = {}
          if os.path.exists("slides_data.json"):
              with open("slides_data.json", "r", encoding="utf-8") as f:
                  existing = json.load(f)
          url = "https://docs.google.com/presentation/d/1IR-BTZCYyhxH32vfEI7ogHkk7HoYfo5MBYHqpJoptFU/export/pptx"
          data = urllib.request.urlopen(url, timeout=20).read()
          prs = Presentation(io.BytesIO(data))
          out = {"_titles": {}, "_live_empty": []}
          for i in range(2, len(prs.slides)):
              key = str(i+1)
              s = prs.slides[i]
              for sh in s.shapes:
                  if sh.has_text_frame and sh.text_frame.text.strip():
                      lines = [ln.strip() for ln in sh.text_frame.text.split("\n") if ln.strip()]
                      if len(lines) >= 2:
                          out["_titles"][key] = lines[1]
                          break
              tables = [[[extract_cell_text(c) for c in r.cells] for r in sh.table.rows] for sh in s.shapes if sh.has_table]
              has_content = any(
                  len(r) > 1 and r[1].strip() not in ("", "•", "• [활동 1]\n\n• [활동 2]", "• [활동 1]\n• [활동 2]")
                  for t in tables for r in t[1:]
              )
              if not has_content:
                  out["_live_empty"].append(key)
              if not has_content and key in existing:
                  out[key] = existing[key]
              else:
                  out[key] = tables
          with open("slides_data.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          with open("slides_data.js", "w", encoding="utf-8") as f:
              f.write("window.PRELOADED_SLIDES = " + json.dumps(out, ensure_ascii=False) + ";")
          EOF

      - name: Commit updated slide data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain slides_data.json slides_data.js) ]]; then
            git add slides_data.json slides_data.js
            git commit -m "chore: auto-sync latest lesson plans from Google Slides"
            git pull --rebase origin main
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
